<!DOCTYPE html>
<html>
<head>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@700&display=swap" rel="stylesheet">
<style>
  body { font-family: 'Inter', sans-serif; font-size: 4.5rem; font-weight: 700; line-height: 1.1; }
  .wrapper {
    display: inline-flex;
    background: #dbeafe;
    color: #1d4ed8;
    border-radius: 16px;
    overflow: hidden;
    height: 1.2em;
    vertical-align: middle;
  }
  .track {
    display: flex;
    flex-direction: column;
    align-items: flex-start;
  }
  .word {
    height: 1.2em;
    display: flex;
    align-items: center;
    padding: 0 1rem;
  }
</style>
</head>
<body>
  Your personal <span class="wrapper">
    <span class="track">
      <span class="word">chemistry</span>
      <span class="word">biology</span>
    </span>
  </span> test
</body>
</html>
