<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/demo/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>LabCoat AR | Master Dashboard</title>
    <meta name="description" content="LabCoat AR Dashboard: Real-time immutable audit trail, employee management, and equipment tracking for smart laboratories." />
    <script type="module" crossorigin src="/demo/assets/index-DM3VAnSa.js"></script>
    <link rel="stylesheet" crossorigin href="/demo/assets/index-CeTG8X4s.css">
  </head>
  <body>
    <div id="error-overlay" style="color: red; padding: 20px; font-family: monospace; z-index: 9999; position: relative; display: none; background: #fff; border-bottom: 2px solid red;"></div>
    <script>
      window.onerror = function(message, source, lineno, colno, error) {
        var overlay = document.getElementById('error-overlay');
        overlay.style.display = 'block';
        overlay.innerHTML += '<p><strong>Error:</strong> ' + message + '<br/>At: ' + source + ':' + lineno + ':' + colno + '<br/><pre>' + (error && error.stack ? error.stack : '') + '</pre></p>';
        return false;
      };
      window.addEventListener('unhandledrejection', function(event) {
        var overlay = document.getElementById('error-overlay');
        overlay.style.display = 'block';
        overlay.innerHTML += '<p><strong>Unhandled Promise Rejection:</strong> ' + event.reason + '</p>';
      });
    </script>
    <div id="root"></div>
  </body>
</html>
